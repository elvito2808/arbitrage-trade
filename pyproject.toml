[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbitrage-trade"
version = "0.1.0"
description = "Read-only cross-exchange and DEX market analysis foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
arbitrage-trade = "arbitrage_trade.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
